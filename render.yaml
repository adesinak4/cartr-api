databases:
  - name: cartr-postgres
    plan: free
    databaseName: cartr
    user: cartr

services:
  - name: cartr-redis
    type: keyvalue
    plan: free
    ipAllowList: [] # internal-only — only cartr-api needs to reach this

  - name: cartr-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    preDeployCommand: pnpm migrate
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — main.ts already reads
      # process.env.PORT via AppConfigService, nothing to set here.

      - key: DATABASE_URL
        fromDatabase:
          name: cartr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: cartr-redis
          type: keyvalue
          property: connectionString

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY_DAYS
        value: "7"

      # Real Flutterwave credentials — must be filled in manually in the
      # Render dashboard after the first deploy (sync: false means Render
      # will prompt for these rather than guessing a value).
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_BASE_URL
        value: https://api.flutterwave.com/v3

      - key: ORDER_RESERVATION_TIMEOUT_MINUTES
        value: "30"
      - key: SUBSCRIPTION_TRIAL_DAYS
        value: "14"
      - key: SUBSCRIPTION_GRACE_PERIOD_DAYS
        value: "7"
      - key: SUBSCRIPTION_RENEWAL_RETRY_INTERVAL_DAYS
        value: "2"
      - key: CUSTOM_DOMAIN_VERIFICATION_TIMEOUT_DAYS
        value: "7"
